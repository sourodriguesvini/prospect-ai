# Configuração do Supabase LOCAL (CLI). Escrita à mão, sem a CLI instalada: na primeira
# execução de `supabase start`, compare com a saída de `supabase init` em uma pasta temporária
# e corrija chaves que a versão da CLI não reconheça (docs/known-issues.md).
#
# O Prospector não usa o Supabase Auth (ADR-0007): o app acessa o banco só pelo servidor,
# com a secret key. A API pública fica ligada porque é por ela que o servidor fala com o banco,
# mas anon/authenticated não têm acesso a nenhuma tabela.
project_id = "prospector"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Deve coincidir com a versão do projeto remoto (Settings → Infrastructure no painel).
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Sem cadastro: ninguém cria conta pela API pública.
enable_signup = false

[auth.email]
enable_signup = false
