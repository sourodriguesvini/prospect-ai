name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Typecheck, lint de fronteiras, unitários, banco em PGlite e E2E smoke. Não precisa de Docker.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm --filter @prospector/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Mesmas migrações e testes de banco contra o Supabase real (CLI + Docker do runner) e o E2E
  # com banco (e2e/database.spec.ts). AINDA NÃO EXECUTADO: validar na primeira execução
  # (docs/known-issues.md KI-008, KI-009).
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Exportar variáveis do Supabase local
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase.json"
          {
            echo "SUPABASE_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_SECRET_KEY=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "TEST_DATABASE_URL=$(jq -r '.DB_URL' "$RUNNER_TEMP/supabase.json")"
          } >> "$GITHUB_ENV"
      - run: pnpm test:db
      - run: pnpm --filter @prospector/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_SUPABASE: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-supabase
          path: apps/web/playwright-report
          retention-days: 7
